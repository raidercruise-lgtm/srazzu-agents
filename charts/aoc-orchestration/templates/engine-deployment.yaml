apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aoc-orchestration.fullname" . }}-engine
  namespace: {{ default .Release.Namespace .Values.global.namespaceOverride }}
  labels:
    {{- include "aoc-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  {{- if not .Values.engine.autoscaling.enabled }}
  replicas: {{ .Values.engine.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aoc-orchestration.engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aoc-orchestration.engine.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: engine
          image: "{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag }}"
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.engine.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aoc-orchestration.fullname" . }}-config
            - secretRef:
                name: {{ include "aoc-orchestration.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20