apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-broker
  namespace: aoc-orchestration
  labels:
    app.kubernetes.io/component: broker
    app.kubernetes.io/name: swarm-broker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: swarm-broker
  template:
    metadata:
      labels:
        app: swarm-broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
      containers:
        - name: swarm-broker
          image: ghcr.io/your-org/swarm_broker:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: ws-http
          envFrom:
            - configMapRef:
                name: aoc-config
            - secretRef:
                name: aoc-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: swarm-broker-service
  namespace: aoc-orchestration
  labels:
    app: swarm-broker
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: ws-http
      protocol: TCP
  selector:
    app: swarm-broker