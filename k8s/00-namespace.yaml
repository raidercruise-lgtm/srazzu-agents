apiVersion: v1
kind: Namespace
metadata:
  name: aoc-orchestration
  labels:
    app.kubernetes.io/name: aoc-orchestration
    app.kubernetes.io/part-of: aoc-engine
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: aoc-engine-critical
value: 1000000
globalDefault: false
description: "High priority class for core AOC Orchestration engine components to prevent eviction."