apiVersion: v1
kind: ConfigMap
metadata:
  name: aoc-config
  namespace: aoc-orchestration
data:
  # Internal Cluster DNS targets
  DATABASE_HOST: "aoc-db-postgres.aoc-orchestration.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "aoc_db"
  REDIS_HOST: "aoc-redis.aoc-orchestration.svc.cluster.local"
  REDIS_PORT: "6379"
  BROKER_URL: "http://swarm-broker-service:8080"
  ENGINE_URL: "http://aoc-engine-service:8000"
  CHECK_INTERVAL_SECONDS: "5.0"
  WORKER_TIMEOUT_SECONDS: "15.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: aoc-secrets
  namespace: aoc-orchestration
type: Opaque
stringData:
  # In production, substitute using SealedSecrets or ExternalSecrets operator
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "ProductionSecurePasswordChangeMe123!"
  DATABASE_URL: "postgresql://postgres:ProductionSecurePasswordChangeMe123!@aoc-db-postgres.aoc-orchestration.svc.cluster.local:5432/aoc_db"
  REDIS_URL: "redis://aoc-redis.aoc-orchestration.svc.cluster.local:6379"