apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoc-redis
  namespace: aoc-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aoc-redis
  template:
    metadata:
      labels:
        app: aoc-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: aoc-redis
  namespace: aoc-orchestration
spec:
  ports:
    - port: 6379
  selector:
    app: aoc-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoc-db-postgres
  namespace: aoc-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aoc-db-postgres
  template:
    metadata:
      labels:
        app: aoc-db-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "ProductionSecurePasswordChangeMe123!"
            - name: POSTGRES_DB
              value: "aoc_db"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: aoc-db-postgres
  namespace: aoc-orchestration
spec:
  ports:
    - port: 5432
  selector:
    app: aoc-db-postgres